name: CodSpeed

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: moonrepo/setup-rust@v1
        with:
          channel: stable
          cache-target: release
          bins: cargo-codspeed
      - run: cargo codspeed build
      - uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: cargo codspeed run
