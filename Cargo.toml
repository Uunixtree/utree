[package]
name = "utree"
version = "0.1.1"
edition = "2024"
rust-version = "1.98"
license = "GPL-2.0-or-later"
description = "A Rust reimplementation of the Unix tree command"
repository = "https://github.com/Uunixtree/utree"
include = [
    "/src",
    "/benches",
    "/doc",
    "/README.md",
    "/COMPATIBILITY.md",
    "/LICENSE",
]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
proptest = "1"
criterion = "0.5"

[[bench]]
name = "walk"
harness = false
